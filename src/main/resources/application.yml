server:
  port: 8011
  
logging:
  level:
    ch:
      bus:
        gps: INFO
    org:
#      hibernate:
#        SQL: DEBUG
#        type:
#          descriptor:
#            sql:
#              BasicBinder: TRACE
      springframework:
        web: INFO
    root: INFO
spring:
  application:
    name: burry-gps
  banner:
    location: classpath:/static/bannername.txt
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQL9Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
        hbm2dll:
          extra_physical_table_types: MATERIALIZED VIEW
        format_sql: true
#        show_sql: true
        temp:
          use_jdbc_metadata_defaults: false
management:
  health:
    probes:
      enabled: true
  endpoint:
    health:
      group:
        custom:
          include: ping

gps:
  map:
    tile-user-agent: "RoadPanel/1.0 (https://altidoma.ch; contact: info@altidoma.ch)"
    tile-referer: https://altidoma.ch/
    tile-cache-dir: /tmp/map-tile-cache
    tile-timeout-ms: 10000
    osm-url-template: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    light-url-template: https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png
